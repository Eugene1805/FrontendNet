services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5000}:5000"
    extra_hosts:
      - "api.tienda.lan:${IP_VM2:-127.0.0.1}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ApiBaseUrl=${API_BASE_URL:-https://api.tienda.lan}
      - Security__RequireHttps=${SECURITY_REQUIRE_HTTPS:-true}
      - Security__ForwardedForHeaderName=${SECURITY_FORWARDED_FOR_HEADER_NAME:-X-Forwarded-For}
      - Security__TrustedProxyCidrs__0=${TRUSTED_PROXY_CIDR_0:-127.0.0.1/32}
      - Security__TrustedProxyCidrs__1=${TRUSTED_PROXY_CIDR_1:-172.16.0.0/12}
      - Cloudflare__TurnstileSiteKey=${CLOUDFLARE_TURNSTILE_SITE_KEY:-}
      - Cloudflare__TurnstileSecretKey=${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      - SSL_CERT_FILE=${SSL_CERT_FILE:-/run/certs/ca-bundle.crt}
    volumes:
      - type: bind
        source: ./.certs/ca-bundle.crt
        target: /run/certs/ca-bundle.crt
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
